name: GTT monitor auto

# GitHub non sta eseguendo la pianificazione (cron), quindi il monitor si
# rilancia da solo: ogni run controlla per ~2 ore (ogni 2 minuti dalle 23:50
# alle 12:00 ora italiana, ogni ora nel resto del giorno) e alla fine avvia il
# run successivo. Per avviarlo basta un "Run workflow" a mano.
# Per FERMARLO: Actions -> GTT monitor auto -> "..." -> Disable workflow
# (annullare un run da solo non basta se ce n'e' uno in coda).
# Il cron orario e' solo un ripiego, nel caso la catena si interrompa.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Solo test: stampa cosa legge dalla pagina, salva gli screenshot e invia una notifica di prova'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: gtt-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Playwright e Chromium
        run: |
          pip install playwright tzdata
          python -m playwright install --with-deps chromium

      - name: Controlla gli slot
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gtt_slot_monitor.py ${{ inputs.probe && '--probe' || '--duration 120' }}

      - name: Salva gli screenshot del test
        if: ${{ inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe_*.png

      - name: Avvia il run successivo
        if: ${{ !cancelled() && !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se il controllo e' andato male, aspetta un po' per non girare a vuoto
          if [ "${{ steps.check.outcome }}" != "success" ]; then sleep 180; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/gtt-chain.yml/dispatches" -f ref=main
