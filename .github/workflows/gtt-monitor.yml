name: GTT slot monitor

# GitHub non garantisce la puntualita' dei run pianificati (a volte li ritarda o
# li salta). Per questo ogni run dura ~28 minuti e controlla da solo ogni 2 minuti
# (gli intervalli veri li decide lo script), e se ne lancia uno ogni mezz'ora:
# se un lancio salta, il buco e' al massimo di una mezz'ora.
#
# Orari UTC. Finestra intensa (ogni 2 minuti, ora italiana 23:50-12:00):
#   21:50-11:18 UTC copre sia l'ora legale (fino al 25/10) sia quella solare.
# Fuori finestra: un controllo all'ora (i run delle XX:00).
on:
  schedule:
    - cron: '50 21 * * *'
    - cron: '20,50 22,23,0-9 * * *'
    - cron: '20,50 10 * * *'
    - cron: '0 11-21 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Solo test: stampa cosa legge dalla pagina, salva gli screenshot e invia una notifica di prova'
        type: boolean
        default: false

concurrency:
  group: gtt-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Playwright e Chromium
        run: |
          pip install playwright tzdata
          python -m playwright install --with-deps chromium

      - name: Controlla gli slot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gtt_slot_monitor.py ${{ inputs.probe && '--probe' || '--duration 28' }}

      - name: Salva gli screenshot del test
        if: ${{ inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe_*.png
