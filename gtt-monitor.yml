name: GTT slot monitor

# GitHub Actions usa solo l'ora UTC e non scende sotto i 5 minuti.
# Finestra intensa: 21:50-10:55 UTC = 23:50-12:55 in ora legale (fino al 25/10)
# e 22:50-11:55 con l'ora solare (dal 25/10). E' sempre piu' larga del 23:50-12:00
# richiesto, cosi' non ci sono buchi attorno al cambio ora.
# Fuori finestra: un controllo all'ora.
on:
  schedule:
    - cron: '50,55 21 * * *'
    - cron: '*/5 22,23,0-9 * * *'
    - cron: '*/5 10 * * *'
    - cron: '0 11-20 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Solo test: stampa cosa legge dalla pagina e salva gli screenshot'
        type: boolean
        default: false

concurrency:
  group: gtt-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa Playwright e Chromium
        run: |
          pip install playwright tzdata
          python -m playwright install --with-deps chromium

      - name: Controlla gli slot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gtt_slot_monitor.py ${{ inputs.probe && '--probe' || '--once' }}

      - name: Salva gli screenshot del test
        if: ${{ inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe_*.png
